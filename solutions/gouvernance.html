        <p class="hero__lead" data-fr="De la stratégie à la conformité réglementaire, nous structurons et pilotons votre cybersécurité — et nous tenons à vos côtés lorsque la crise frappe." data-en="From strategy to regulatory compliance, we structure and steer your cybersecurity — and stand by you when crisis strikes."></p>

    <!-- Conseil & expertise -->
    <section class="section" id="conseil">
      <div class="container">
        <div class="grid grid-2" style="align-items:center">
          <div data-reveal="left">
            <span class="eyebrow" data-fr="Conseil & expertise · RSSI" data-en="Consulting & expertise · CISO"></span>
            <h2 class="section-title" data-fr="Une expertise stratégique à vos côtés" data-en="Strategic expertise at your side"></h2>
            <p class="section-lead" data-fr="Beaucoup d'organisations n'ont pas besoin d'un RSSI à temps plein, mais d'une expertise disponible et structurante. Nos consultants posent un diagnostic, priorisent les risques et construisent avec vous une feuille de route réaliste : stratégie, politiques, architecture de sécurité, analyse de risques et continuité d'activité — à temps partagé ou en renfort de vos équipes." data-en="Many organizations don't need a full-time CISO, but rather expertise that is available and structuring. Our consultants establish a diagnosis, prioritize risks and build a realistic roadmap with you: strategy, policies, security architecture, risk analysis and business continuity — as a shared resource or to reinforce your teams."></p>
            <ul class="feature-list" style="margin-top:var(--s-5)">
              <li data-fr="Stratégie et gouvernance de la sécurité" data-en="Security strategy and governance"></li>
              <li data-fr="Analyse de risques EBIOS Risk Manager / ISO 27005" data-en="Risk analysis with EBIOS Risk Manager / ISO 27005"></li>
              <li data-fr="Accompagnement à la mise en place d'un SMSI (ISO 27001)" data-en="Support implementing an ISMS (ISO 27001)"></li>
              <li data-fr="Rédaction de la politique de sécurité (PSSI) et des procédures" data-en="Security policy (ISSP) and procedure drafting"></li>
              <li data-fr="Accompagnement RSSI à temps partagé" data-en="Shared-time CISO support"></li>
              <li data-fr="Élaboration et pilotage de la feuille de route SSI" data-en="Building and steering the security roadmap"></li>
              <li data-fr="Reporting et indicateurs de sécurité pour la direction" data-en="Security reporting and KPIs for leadership"></li>
              <li data-fr="Plan de continuité et de reprise d'activité (PCA / PRA)" data-en="Business continuity and disaster recovery planning (BCP / DRP)"></li>

        </div>

    <!-- Conformité -->
    <section class="section" id="conformite">
      <div class="container">

          <h2 class="section-title" data-fr="RGPD, NIS-2, DORA : transformez l'obligation en avantage" data-en="GDPR, NIS-2, DORA: turn obligation into advantage"></h2>
          <p class="section-lead" data-fr="Nous traduisons ces exigences en actions concrètes, en partant de l'existant pour éviter le travail inutile : diagnostic d'écart (gap analysis), plan de mise en conformité priorisé, documentation (registre, politiques, procédures) et préparation aux audits et contrôles." data-en="We translate these requirements into concrete actions, starting from what already exists to avoid unnecessary work: gap analysis, prioritized compliance plan, documentation (register, policies, procedures) and preparation for audits and inspections."></p>
        </div>

        <div class="acc" data-acc data-stagger>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Conformité RGPD" data-en="GDPR Compliance"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="Nous accompagnons votre mise en conformité au Règlement Général sur la Protection des Données : cartographie des traitements, registre, analyse d'impact (PIA), sécurisation des données personnelles et gouvernance de la protection des données." data-en="We support your compliance with the General Data Protection Regulation: processing mapping, register, impact assessment (PIA), personal-data security and data-protection governance."></div></div>
          </div>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Directive NIS-2" data-en="NIS-2 Directive"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="La directive NIS-2 étend les obligations de cybersécurité à un périmètre élargi d'entités essentielles et importantes. Nous évaluons votre éligibilité, mesurons votre écart de conformité et bâtissons votre feuille de route avant l'entrée en application." data-en="The NIS-2 directive extends cybersecurity obligations to a broader scope of essential and important entities. We assess your eligibility, measure your compliance gap and build your roadmap ahead of enforcement."></div></div>
          </div>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Règlement DORA" data-en="DORA Regulation"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="DORA renforce la résilience opérationnelle numérique du secteur financier européen. Nous vous aidons à structurer la gestion des risques liés aux TIC, les tests de résilience et la supervision des prestataires tiers critiques." data-en="DORA strengthens the digital operational resilience of the European financial sector. We help you structure ICT risk management, resilience testing and oversight of critical third-party providers."></div></div>
          </div>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Continuité d'activité (PCA / PRA)" data-en="Business continuity (BCP / DRP)"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="Nous vous aidons à bâtir et tester votre Plan de Continuité (PCA) et votre Plan de Reprise d'Activité (PRA) : identification des activités critiques, scénarios de sinistre, procédures de bascule et de reprise — un dispositif dimensionné à votre structure, sans usine à gaz." data-en="We help you build and test your Business Continuity Plan (BCP) and Disaster Recovery Plan (DRP): identification of critical activities, disaster scenarios, failover and recovery procedures — a setup scaled to your structure, with no needless complexity."></div></div>
          </div>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Certifications & méthodes" data-en="Certifications & methods"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="Nos consultants s'appuient sur des certifications et des méthodes reconnues — ISO 27001 (Lead Implementer), ISO 27005 (Senior Lead Risk Manager PECB), EBIOS Risk Manager et ITIL — un gage d'exigence pour structurer votre sécurité et vous accompagner, le cas échéant, vers vos propres certifications." data-en="Our consultants rely on recognized certifications and methods — ISO 27001 (Lead Implementer), ISO 27005 (Senior Lead Risk Manager PECB), EBIOS Risk Manager and ITIL — a guarantee of rigor to structure your security and, where relevant, guide you toward your own certifications."></div></div>
          </div>
