      <nav class="crumbs" aria-label="Fil d'ariane">

      </nav>

    <section class="page-hero">
      <span class="hero__orb hero__orb--2"></span>
      <div class="container">
        <span class="eyebrow" data-fr="Audit & test d'intrusion" data-en="Audit & penetration testing"></span>
        <h1 data-fr="Révélez vos failles avant qu'on ne les exploite" data-en="Reveal your flaws before they are exploited"></h1>
        <p class="hero__lead" data-fr="Une vulnérabilité non corrigée est une porte ouverte. Nous testons votre système d'information comme le ferait un attaquant, identifions les faiblesses techniques et organisationnelles, les hiérarchisons par criticité et vous donnons un plan de remédiation clair — pas une liste brute de problèmes." data-en="An unpatched vulnerability is an open door. We test your information system the way an attacker would, identify technical and organizational weaknesses, rank them by severity and give you a clear remediation plan — not a raw list of problems."></p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="grid grid-3" data-stagger>

          <article class="card" id="pentest"><div class="card__icon" data-ico="target"></div>
            <h3 data-fr="Test d'intrusion — Pentest" data-en="Penetration Testing — Pentest"></h3>
            <p data-fr="Nos experts simulent des attaques réelles (boîte noire, grise ou blanche) sur vos applications, réseaux et infrastructures : test externe (exposition Internet), test interne (attaquant déjà dans le réseau) et test applicatif et web (OWASP), pour identifier les chemins d'exploitation avant les attaquants." data-en="Our experts simulate real attacks (black, grey or white box) on your applications, networks and infrastructure: external testing (Internet exposure), internal testing (attacker already inside the network) and application & web testing (OWASP), to identify exploitation paths before attackers do."></p>
          </article>

          <article class="card" id="vulnerabilites"><div class="card__icon" data-ico="scan"></div>
            <h3 data-fr="Audit de vulnérabilités" data-en="Vulnerability Audit"></h3>
            <p data-fr="Analyse et cartographie automatisée et continue des failles présentes sur votre système d'information, avec hiérarchisation des risques et recommandations de remédiation priorisées." data-en="Automated, continuous analysis and mapping of flaws across your information system, with risk prioritization and prioritized remediation recommendations."></p>
          </article>

          <article class="card" id="configuration"><div class="card__icon" data-ico="server"></div>
            <h3 data-fr="Audit de configuration & d'architecture" data-en="Configuration & Architecture Audit"></h3>
            <p data-fr="Audit de configuration des postes, serveurs, Active Directory et cloud, et audit d'architecture réseau, pour durcir votre socle technique et réduire la surface d'attaque." data-en="Configuration audit of workstations, servers, Active Directory and cloud, plus a network-architecture audit, to harden your technical foundation and reduce the attack surface."></p>
          </article>

          <article class="card" id="code"><div class="card__icon" data-ico="code"></div>
            <h3 data-fr="Audit de code" data-en="Code Audit"></h3>
            <p data-fr="Revue de sécurité de votre code source pour détecter les vulnérabilités logicielles, les mauvaises pratiques et les défauts de conception au plus tôt." data-en="Security review of your source code to detect software vulnerabilities, bad practices and design flaws as early as possible."></p>
          </article>

          <article class="card" id="flash"><span class="card__tag">360°</span><div class="card__icon" data-ico="bolt"></div>
            <h3 data-fr="Audit Flash 360°" data-en="Audit Flash 360°"></h3>
            <p data-fr="Un audit complet et rapide qui établit en quelques jours votre cyber-score, une cartographie des risques et un plan d'action priorisé pour démarrer." data-en="A fast, comprehensive audit that delivers your cyber score, a risk map and a prioritized action plan within days."></p>
          </article>

          <article class="card" id="darkweb"><div class="card__icon" data-ico="eye"></div>
            <h3 data-fr="Dark Web Monitoring" data-en="Dark Web Monitoring"></h3>
            <p data-fr="Surveillance du dark web et des forums clandestins pour détecter vos données exposées, identifiants compromis et menaces émergentes vous concernant." data-en="Monitoring of the dark web and underground forums to detect your exposed data, compromised credentials and emerging threats targeting you."></p>
          </article>

          <article class="card" id="phishing"><div class="card__icon" data-ico="fish"></div>
            <h3 data-fr="Campagne de phishing & sensibilisation" data-en="Phishing & Awareness Campaign"></h3>
            <p data-fr="Des campagnes de phishing simulées pour mesurer la vigilance de vos collaborateurs et les former par la pratique à reconnaître les attaques." data-en="Simulated phishing campaigns to measure your employees' vigilance and train them, hands-on, to recognize attacks."></p>
          </article>

          <article class="card" id="stress"><div class="card__icon" data-ico="pulse"></div>
            <h3 data-fr="Stress test SOC" data-en="SOC Stress Test"></h3>
            <p data-fr="Une simulation d'attaque pour éprouver la réactivité et l'efficacité de votre SOC : détection, qualification et réponse face à un scénario offensif réaliste." data-en="An attack simulation to test your SOC's responsiveness and effectiveness: detection, triage and response against a realistic offensive scenario."></p>
          </article>

          <article class="card glass" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start">
            <h3 style="font-size:var(--fs-h3)" data-fr="Un doute sur votre exposition ?" data-en="Unsure about your exposure?"></h3>
            <p data-fr="Parlons de l'audit le plus adapté à votre contexte." data-en="Let's discuss the audit best suited to your context."></p>
            <a class="btn btn--primary" style="margin-top:var(--s-4)" href="../contact.html?subject=audit" data-i18n="cta_expert"></a>
          </article>

        </div>
      </div>
    </section>

    <!-- Méthodologie -->
    <section class="section">
      <div class="container">
        <div class="section-head" data-reveal="up">
          <span class="eyebrow" data-fr="Notre méthodologie" data-en="Our methodology"></span>
          <h2 class="section-title" data-fr="Une démarche cadrée, du périmètre à la remédiation" data-en="A framed approach, from scope to remediation"></h2>
        </div>
        <div class="spine" data-stagger style="max-width:820px;margin-inline:auto">
          <span class="spine__line"></span>
          <div class="spine__step"><div class="spine__num">01</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Cadrage & périmètre" data-en="Scoping & perimeter"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Nous définissons ensemble les cibles, les règles d'engagement et les objectifs." data-en="Together we define the targets, the rules of engagement and the objectives."></p></div></div>
          <div class="spine__step"><div class="spine__num">02</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Reconnaissance & cartographie" data-en="Reconnaissance & mapping"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Collecte d'informations et identification de la surface d'attaque." data-en="Information gathering and identification of the attack surface."></p></div></div>
          <div class="spine__step"><div class="spine__num">03</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Tests & exploitation contrôlée" data-en="Testing & controlled exploitation"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Recherche et vérification des vulnérabilités, sans impact sur la production." data-en="Searching for and verifying vulnerabilities, with no impact on production."></p></div></div>
          <div class="spine__step"><div class="spine__num">04</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Rapport priorisé" data-en="Prioritized report"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Criticité, preuves, impact métier et recommandations de remédiation." data-en="Severity, evidence, business impact and remediation recommendations."></p></div></div>
          <div class="spine__step"><div class="spine__num">05</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Restitution & accompagnement" data-en="Debrief & support"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Présentation à vos équipes et soutien pour corriger durablement." data-en="Presentation to your teams and support to fix issues for good."></p></div></div>
        </div>
        <div class="grid grid-2" style="margin-top:var(--s-7);align-items:start">
          <div data-reveal="left">
            <span class="eyebrow" data-fr="Livrables" data-en="Deliverables"></span>
            <h3 class="section-title" style="font-size:var(--fs-h3)" data-fr="Ce que vous obtenez" data-en="What you get"></h3>
            <ul class="feature-list" style="margin-top:var(--s-5)">
              <li data-fr="Rapport technique détaillé (vulnérabilités, preuves, criticité)" data-en="Detailed technical report (vulnerabilities, evidence, severity)"></li>
              <li data-fr="Synthèse pour la direction, sans jargon" data-en="Executive summary, free of jargon"></li>
              <li data-fr="Plan de remédiation priorisé" data-en="Prioritized remediation plan"></li>
              <li data-fr="Restitution orale et échange avec vos équipes" data-en="Oral debrief and discussion with your teams"></li>
            </ul>
          </div>
          <div class="card glass" data-reveal="right">
            <span class="eyebrow" data-fr="Pour qui ?" data-en="Who is it for?"></span>
            <h3 style="font-size:var(--fs-h3);margin-top:var(--s-2)" data-fr="Connaître son exposition réelle" data-en="Know your real exposure"></h3>
            <p style="color:var(--c-text-mut);margin-top:var(--s-3)" data-fr="PME, collectivités et ESN qui veulent connaître leur niveau d'exposition réel : avant une certification, après un incident, ou simplement pour piloter le risque." data-en="SMEs, local authorities and IT-service firms that want to know their real exposure level: before a certification, after an incident, or simply to manage risk."></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head" data-reveal="up">
          <span class="eyebrow" data-fr="Questions fréquentes" data-en="Frequently asked questions"></span>
          <h2 class="section-title" data-fr="Tout ce qu'il faut savoir avant un test" data-en="What to know before a test"></h2>
        </div>
        <div class="acc" data-acc data-stagger>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Un test d'intrusion peut-il casser mon système ?" data-en="Can a penetration test break my system?"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="Non. Nous travaillons selon des règles d'engagement strictes et privilégions l'exploitation contrôlée. Les tests à risque sont validés avec vous au préalable et peuvent être menés hors production." data-en="No. We work under strict rules of engagement and favor controlled exploitation. Higher-risk tests are validated with you beforehand and can be run outside production."></div></div>
          </div>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Combien de temps dure une mission ?" data-en="How long does an engagement last?"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="Selon le périmètre, de quelques jours à quelques semaines. Le cadrage initial permet d'estimer précisément la charge." data-en="Depending on scope, from a few days to a few weeks. The initial scoping lets us estimate the workload precisely."></div></div>
          </div>
          <div class="acc__item">
            <button class="acc__head"><span data-fr="Repartons-nous avec des correctifs concrets ?" data-en="Do we leave with concrete fixes?"></span><span class="acc__ico">+</span></button>
            <div class="acc__body"><div data-fr="Oui. Chaque vulnérabilité est accompagnée d'une recommandation actionnable, et nous restons disponibles pour vous aider à la mettre en œuvre. Vous repartez avec un rapport technique détaillé (preuves, criticité), une synthèse pour la direction sans jargon et un plan de remédiation priorisé." data-en="Yes. Each vulnerability comes with an actionable recommendation, and we stay available to help you implement it. You leave with a detailed technical report (evidence, severity), a jargon-free executive summary and a prioritized remediation plan."></div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band" data-reveal="scale">
          <h2 data-fr="Commencez par un Audit Flash 360°" data-en="Start with an Audit Flash 360°"></h2>
          <p data-fr="En quelques jours, obtenez une vision claire de vos risques et un plan d'action priorisé, sans engagement." data-en="Within days, get a clear view of your risks and a prioritized action plan, with no commitment."></p>
          <div class="hero__cta"><a class="btn btn--primary btn--lg" href="../contact.html?subject=audit" data-i18n="cta_expert"></a></div>
        </div>
      </div>
    </section>
