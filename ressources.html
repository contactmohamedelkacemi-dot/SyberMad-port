    <!-- Glossary -->
    <section class="section" id="glossaire">
      <div class="container">
        <div class="section-head" data-reveal="up">
          <span class="eyebrow" data-fr="Glossaire" data-en="Glossary"></span>
          <h2 class="section-title" data-fr="Le vocabulaire de la cybersécurité, clairement expliqué" data-en="The vocabulary of cybersecurity, clearly explained"></h2>
        </div>
        <div class="acc" data-acc data-stagger>
          <div class="acc__item"><button class="acc__head"><span>APT — Advanced Persistent Threat</span><span class="acc__ico">+</span></button><div class="acc__body"><div data-fr="Menace persistante avancée : attaque ciblée et durable, généralement menée par un groupe disposant de moyens importants, visant à s'infiltrer durablement dans un système d'information." data-en="A targeted, long-lasting attack, usually carried out by a well-resourced group, aiming to persistently infiltrate an information system."></div></div></div>
          <div class="acc__item"><button class="acc__head"><span>CVE — Common Vulnerabilities and Exposures</span><span class="acc__ico">+</span></button><div class="acc__body"><div data-fr="Système de référencement public des vulnérabilités connues, identifiant chaque faille par un code unique pour faciliter son suivi." data-en="A public reference system for known vulnerabilities, identifying each flaw with a unique code to ease tracking."></div></div></div>
          <div class="acc__item"><button class="acc__head"><span>DDoS — Distributed Denial of Service</span><span class="acc__ico">+</span></button><div class="acc__body"><div data-fr="Attaque par déni de service distribué : saturation d'un service en ligne par un afflux massif de requêtes provenant de multiples sources." data-en="A distributed denial-of-service attack: saturating an online service with a massive flood of requests from multiple sources."></div></div></div>
          <div class="acc__item"><button class="acc__head"><span>EDR — Endpoint Detection and Response</span><span class="acc__ico">+</span></button><div class="acc__body"><div data-fr="Solution de détection et de réponse sur les terminaux, qui surveille en continu les postes et serveurs pour détecter et neutraliser les comportements malveillants." data-en="An endpoint detection and response solution that continuously monitors workstations and servers to detect and neutralize malicious behavior."></div></div></div>
          <div class="acc__item"><button class="acc__head"><span>SIEM / XDR</span><span class="acc__ico">+</span></button><div class="acc__body"><div data-fr="Le SIEM centralise et corrèle les journaux de sécurité ; le XDR étend la détection et la réponse à l'ensemble des couches (réseau, endpoint, cloud) pour une vision unifiée." data-en="SIEM centralizes and correlates security logs; XDR extends detection and response across all layers (network, endpoint, cloud) for a unified view."></div></div></div>
          <div class="acc__item"><button class="acc__head"><span>Zero-Day</span><span class="acc__ico">+</span></button><div class="acc__body"><div data-fr="Vulnérabilité inconnue de l'éditeur et non corrigée, exploitée par les attaquants avant qu'un correctif ne soit disponible." data-en="A vulnerability unknown to the vendor and unpatched, exploited by attackers before a fix is available."></div></div></div>
        </div>
      </div>
    </section>
