    <div class="container">
      <nav class="crumbs" aria-label="Fil d'ariane">

    <section class="page-hero">
      <span class="hero__orb hero__orb--1"></span>
      <div class="container">
        <span class="eyebrow" data-fr="Notre approche" data-en="Our approach"></span>
        <h1 data-fr="La cybersécurité à 360°" data-en="Cybersecurity at 360°"></h1>
        <p class="hero__lead" data-fr="Une démarche en cinq temps, pensée comme un cycle continu, et trois principes qui guident chaque mission. Chaque étape alimente la suivante pour faire progresser durablement votre niveau de sécurité — pas une prestation isolée." data-en="A five-phase approach designed as a continuous cycle, and three principles that guide every engagement. Each step feeds the next to durably raise your security level — not a one-off service."></p>
      </div>
    </section>

    <!-- 360° cycle -->
    <section class="section--tight">
      <div class="container">
        <div class="spine" data-stagger style="max-width:820px;margin-inline:auto">
          <span class="spine__line"></span>
          <div class="spine__step"><div class="spine__num">01</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Prévenir" data-en="Prevent"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Auditer, tester l'intrusion, détecter les vulnérabilités, sensibiliser les équipes." data-en="Audit, run penetration tests, detect vulnerabilities and raise team awareness."></p></div></div>
          <div class="spine__step"><div class="spine__num">02</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Détecter" data-en="Detect"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Superviser le SI, surveiller les menaces, identifier les incidents au plus tôt." data-en="Monitor the IS, watch for threats and identify incidents as early as possible."></p></div></div>
          <div class="spine__step"><div class="spine__num">03</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Protéger" data-en="Protect"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Durcir les configurations, sécuriser les accès (MFA), réduire la surface d'attaque." data-en="Harden configurations, secure access (MFA) and reduce the attack surface."></p></div></div>
          <div class="spine__step"><div class="spine__num">04</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Réagir" data-en="React"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Intervenir en cas d'incident, investiguer, gérer la crise et la remédiation." data-en="Step in during incidents, investigate, manage the crisis and remediation."></p></div></div>
          <div class="spine__step"><div class="spine__num">05</div><div><h3 style="font-size:var(--fs-h3)" data-fr="Garantir" data-en="Guarantee"></h3><p style="color:var(--c-text-mut);margin-top:6px" data-fr="Mettre en conformité (NIS2, RGPD, ISO 27001) et piloter la gouvernance du risque." data-en="Achieve compliance (NIS2, GDPR, ISO 27001) and steer risk governance."></p></div></div>
        </div>
      </div>
    </section>

    <!-- 3 principles -->
    <section class="section">
      <div class="container">
        <div class="section-head section-head--center" data-reveal="up">
          <span class="eyebrow" data-fr="Notre philosophie" data-en="Our philosophy"></span>
          <h2 class="section-title mx-auto" data-fr="Trois principes, à chaque mission" data-en="Three principles, on every engagement"></h2>
        </div>
        <div class="grid grid-3" data-stagger>
          <div class="card"><div class="card__icon" data-ico="target"></div><h3 data-fr="Pragmatique" data-en="Pragmatic"></h3><p data-fr="Nos recommandations tiennent compte de vos ressources humaines, financières et de vos contraintes opérationnelles." data-en="Our recommendations take into account your human and financial resources and your operational constraints."></p></div>
          <div class="card"><div class="card__icon" data-ico="hand"></div><h3 data-fr="Concret & terrain" data-en="Concrete & field-proven"></h3><p data-fr="Nous vous disons quoi faire, comment, avec quelle priorité et à quel coût — preuves et exemples à l'appui." data-en="We tell you what to do, how, with what priority and at what cost — backed by evidence and examples."></p></div>
          <div class="card"><div class="card__icon" data-ico="shield"></div><h3 data-fr="Accompagnement" data-en="Support"></h3><p data-fr="Notre travail ne s'arrête pas à la remise du rapport : nous restons disponibles jusqu'à la mise en œuvre." data-en="Our work doesn't stop when the report is delivered: we stay available through to implementation."></p></div>
        </div>
      </div>
    </section>

          <div class="hero__cta"><a class="btn btn--primary btn--lg" href="contact.html?subject=commercial" data-i18n="cta_expert"></a></div>
        </div>
      </div>
