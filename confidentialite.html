        <h1 class="section-title" style="margin-bottom:var(--s-6)" data-fr="Politique de confidentialité" data-en="Privacy policy"></h1>
        <div class="grid" style="gap:var(--s-6)" data-stagger>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Responsable de traitement" data-en="Data controller"></h3><p style="color:var(--c-text-mut)" data-fr="SyberMad (SASU), éditeur de la marque SyberMad, [adresse, Paris 12e], est responsable du traitement des données collectées via ce site." data-en="SyberMad (SASU), publisher of the SyberMad brand, [address, Paris 12e], is the controller of the data collected via this site."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Données collectées" data-en="Data collected"></h3><p style="color:var(--c-text-mut)" data-fr="Nous collectons uniquement les données que vous nous transmettez via nos formulaires (nom, e-mail professionnel, organisation, message) afin de répondre à vos demandes. Aucune donnée n'est revendue à des tiers." data-en="We only collect the data you provide through our forms (name, work email, organization, message) in order to respond to your requests. No data is ever sold to third parties."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Finalité du traitement" data-en="Purpose of processing"></h3><p style="color:var(--c-text-mut)" data-fr="Vos données sont traitées pour gérer votre demande de contact, vous adresser nos ressources (livres blancs, démos) et, le cas échéant, vous tenir informé de nos actualités avec votre consentement." data-en="Your data is processed to handle your contact request, send you our resources (whitepapers, demos) and, where applicable, keep you informed of our news with your consent."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Base légale" data-en="Legal basis"></h3><p style="color:var(--c-text-mut)" data-fr="Le traitement de vos données repose sur votre consentement et sur notre intérêt légitime à répondre à votre demande et à vous adresser les ressources sollicitées." data-en="The processing of your data is based on your consent and on our legitimate interest in responding to your request and providing the resources you requested."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Conservation" data-en="Retention"></h3><p style="color:var(--c-text-mut)" data-fr="Vos données sont conservées pour la durée nécessaire au traitement de votre demande et conformément aux obligations légales en vigueur." data-en="Your data is retained for the time needed to process your request and in accordance with applicable legal obligations."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Vos droits" data-en="Your rights"></h3><p style="color:var(--c-text-mut)" data-fr="Conformément au RGPD, vous disposez d'un droit d'accès, de rectification, d'effacement, de limitation, d'opposition et de portabilité au traitement de vos données. Vous pouvez exercer ces droits à tout moment et, en cas de difficulté, saisir la CNIL." data-en="In accordance with the GDPR, you have the right to access, rectify, erase, restrict, object to and port the processing of your data. You may exercise these rights at any time and, in case of difficulty, refer the matter to the CNIL (French data-protection authority)."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Sous-traitants" data-en="Processors"></h3><p style="color:var(--c-text-mut)" data-fr="Les éventuels prestataires techniques (hébergeur, outil de messagerie, service de prise de rendez-vous) interviennent dans le strict cadre du traitement de votre demande et sont soumis à des obligations de confidentialité. Aucune donnée n'est transférée hors de ce cadre." data-en="Any technical providers (host, messaging tool, appointment-booking service) act strictly within the scope of processing your request and are bound by confidentiality obligations. No data is transferred outside this scope."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Cookies" data-en="Cookies"></h3><p style="color:var(--c-text-mut)" data-fr="Ce site utilise un minimum de cookies, strictement nécessaires à son fonctionnement et, le cas échéant, à la mesure d'audience. Vous gardez le contrôle de vos préférences." data-en="This site uses a minimum of cookies, strictly necessary for its operation and, where applicable, for audience measurement. You remain in control of your preferences."></p></div>
          <div data-reveal="up"><h3 style="font-size:var(--fs-h3);margin-bottom:var(--s-2)" data-fr="Contact DPO" data-en="DPO contact"></h3><p style="color:var(--c-text-mut)" data-fr="Pour toute question relative à vos données : " data-en="For any question about your data: "></p><a href="mailto:privacy@sybermad.com" style="color:var(--c-cyan)">privacy@sybermad.com</a></div>
