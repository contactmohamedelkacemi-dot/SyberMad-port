<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Rejoignez le programme partenaire Channel First de SyberMad : modèles de partenariat, offre revendeur, formations et catalogue d'intégrations cybersécurité.">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">

<body data-page="partners" data-base="">
  <div id="site-header-slot"></div>
  <main id="main">

    <div class="container">
      <nav class="crumbs" aria-label="Fil d'ariane">
        <a href="index.html" data-fr="Accueil" data-en="Home"></a><span>/</span>
        <span aria-current="page" data-fr="Partenaires" data-en="Partners"></span>
      </nav>
    </div>

    <section class="page-hero">
      <span class="hero__orb hero__orb--1"></span>
      <div class="container">
        <span class="eyebrow">Channel First</span>
        <h1 data-fr="Développez votre activité cybersécurité avec nous" data-en="Grow your cybersecurity business with us"></h1>
        <p class="hero__lead" data-fr="Notre programme partenaire Channel First est conçu pour les revendeurs, intégrateurs et MSP qui souhaitent enrichir leur offre avec nos produits souverains et nos services managés. Un modèle où le partenaire est toujours prioritaire." data-en="Our Channel First partner program is built for resellers, integrators and MSPs who want to enrich their offering with our sovereign products and managed services. A model where the partner always comes first."></p>
        <div class="hero__cta"><a class="btn btn--primary" href="contact.html?subject=partnership" data-fr="Devenir partenaire" data-en="Become a partner"></a></div>
      </div>
    </section>

    <!-- Why join -->
    <section class="section" id="channel-first">
      <div class="container">
        <div class="section-head" data-reveal="up">
          <span class="eyebrow" data-fr="Pourquoi rejoindre Channel First" data-en="Why join Channel First"></span>
          <h2 class="section-title" data-fr="Un programme pensé pour votre croissance" data-en="A program built for your growth"></h2>
        </div>
        <div class="grid grid-3" data-stagger>
          <div class="card"><div class="card__icon" data-ico="rocket"></div><h3 data-fr="Le partenaire d'abord" data-en="Partner first"></h3><p data-fr="Une stratégie 100 % indirecte : nous nous engageons à passer par et à protéger notre réseau de partenaires." data-en="A 100% indirect strategy: we commit to working through and protecting our partner network."></p></div>
          <div class="card"><div class="card__icon" data-ico="chip"></div><h3 data-fr="Des produits différenciants" data-en="Differentiating products"></h3><p data-fr="Proposez ARGUS Detection et ARGUS Mill, des technologies souveraines développées en France et augmentées par l'IA." data-en="Offer ARGUS Detection and ARGUS Mill, sovereign AI-augmented technologies developed in France."></p></div>
          <div class="card"><div class="card__icon" data-ico="users"></div><h3 data-fr="Accompagnement dédié" data-en="Dedicated support"></h3><p data-fr="Support avant-vente, formations et ressources marketing pour réussir vos déploiements." data-en="Pre-sales support, training and marketing resources to succeed in your deployments."></p></div>
        </div>
      </div>
    </section>

    <!-- Models -->
    <section class="section" id="modeles">
      <div class="container">
        <div class="section-head section-head--center" data-reveal="up">
          <span class="eyebrow" data-fr="Nos modèles de partenariat" data-en="Our partnership models"></span>
          <h2 class="section-title mx-auto" data-fr="Trois niveaux d'engagement" data-en="Three levels of engagement"></h2>
        </div>
        <div class="grid grid-3" data-stagger>
          <div class="card"><span class="card__tag" style="color:var(--c-text-mut);border-color:var(--c-line-2)">Silver</span><div class="card__icon" data-ico="link"></div><h3>Silver</h3><p data-fr="Le point d'entrée pour revendre nos solutions et bénéficier des ressources essentielles du programme." data-en="The entry point to resell our solutions and access the program's essential resources."></p><ul class="feature-list" style="margin-top:var(--s-4)"><li data-fr="Accès au catalogue produits" data-en="Access to the product catalog"></li><li data-fr="Support avant-vente" data-en="Pre-sales support"></li></ul></div>
          <div class="card ring"><span class="card__tag" style="color:var(--c-amber)">Gold</span><div class="card__icon" data-ico="award"></div><h3>Gold</h3><p data-fr="Pour les partenaires engagés : remises renforcées, formations et accompagnement marketing." data-en="For committed partners: enhanced discounts, training and marketing support."></p><ul class="feature-list" style="margin-top:var(--s-4)"><li data-fr="Remises commerciales renforcées" data-en="Enhanced commercial discounts"></li><li data-fr="Formations Channel First" data-en="Channel First training"></li><li data-fr="Co-marketing" data-en="Co-marketing"></li></ul></div>
          <div class="card"><span class="card__tag" style="color:var(--c-cyan)">Platinum</span><div class="card__icon" data-ico="rocket"></div><h3>Platinum</h3><p data-fr="Le partenariat stratégique : conditions privilégiées, accès anticipé et accompagnement sur-mesure." data-en="Strategic partnership: privileged terms, early access and tailored support."></p><ul class="feature-list" style="margin-top:var(--s-4)"><li data-fr="Conditions privilégiées" data-en="Privileged terms"></li><li data-fr="Accès anticipé aux nouveautés" data-en="Early access to new releases"></li><li data-fr="Accompagnement dédié" data-en="Dedicated support"></li></ul></div>
        </div>
      </div>
    </section>

    <!-- Offer + training + integrations -->
    <section class="section" id="offre">
      <div class="container">
        <div class="grid grid-3" data-stagger>
          <div class="card glass" id="formations"><div class="card__icon" data-ico="cap"></div><h3 data-fr="Formations Channel First" data-en="Channel First training"></h3><p data-fr="Des formations dédiées à nos partenaires pour maîtriser nos produits, du déploiement à l'exploitation, et monter en compétence sur la cybersécurité." data-en="Training dedicated to our partners to master our products, from deployment to operation, and build cybersecurity expertise."></p></div>
          <div class="card glass"><div class="card__icon" data-ico="bag"></div><h3 data-fr="Offre Channel First" data-en="Channel First offer"></h3><p data-fr="Une version de ARGUS Mill et un catalogue de services pensés pour être revendus et opérés par nos partenaires, avec un modèle économique attractif." data-en="A version of ARGUS Mill and a service catalog designed to be resold and operated by our partners, with an attractive business model."></p></div>
          <div class="card glass" id="integrations"><div class="card__icon" data-ico="layers"></div><h3 data-fr="Catalogue d'intégrations" data-en="Integrations catalog"></h3><p data-fr="Nos solutions s'intègrent avec un large écosystème d'outils de cybersécurité : firewalls, EDR, annuaires, outils de ticketing et bien plus." data-en="Our solutions integrate with a broad ecosystem of cybersecurity tools: firewalls, EDR, directories, ticketing tools and much more."></p></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band" data-reveal="scale">
          <h2 data-fr="Rejoignez le réseau Channel First" data-en="Join the Channel First network"></h2>
          <p data-fr="Parlons de votre activité et construisons ensemble un partenariat gagnant." data-en="Let's talk about your business and build a winning partnership together."></p>
          <div class="hero__cta"><a class="btn btn--primary btn--lg" href="contact.html?subject=partnership" data-fr="Devenir partenaire" data-en="Become a partner"></a></div>
        </div>
      </div>
    </section>

  </main>
  <div id="site-footer-slot"></div>
